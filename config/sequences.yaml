# Follow-up Sequence Definitions
# Each sequence defines a series of email steps with templates and wait periods

sequences:
  default:
    name: "Testing Sequence"
    # Schedule initial email for next day at specified time (24-hour format, CST timezone)
    # Format: "HH:MM" - If current time is past this time today, schedules for next day
    # Set to null or remove to send immediately when campaign runs
    schedule_initial_at: "09:00"  # Schedule for 9 AM CST next day
    steps:
      - step: 0
        template: "initial"
        wait_days: 0  # TESTING: Set to 0 for immediate follow-up (change back to 3 for production)
        subject: "Application for {{ role_title }} position at {{ company }}"
      - step: 1
        template: "followup_1"
        wait_days: 0  # TESTING: Set to 0 for immediate follow-up (change back to 5 for production)
        subject: "Following up on my application for {{ role_title }} at {{ company }}"
      - step: 2
        template: "followup_2"
        wait_days: 0  # TESTING: Set to 0 for immediate follow-up (change back to 7 for production)
        subject: "Final follow-up: {{ role_title }} position at {{ company }}"

  aggressive:
    name: "Aggressive Sequence"
    schedule_initial_at: "08:00"  # Schedule for 8 AM CST next day (earlier for aggressive)
    steps:
      - step: 0
        template: "initial"
        wait_days: 2
        subject: "Application for {{ role_title }} position at {{ company }}"
      - step: 1
        template: "followup_1"
        wait_days: 3
        subject: "Following up on my application for {{ role_title }} at {{ company }}"
      - step: 2
        template: "followup_2"
        wait_days: 4
        subject: "Final follow-up: {{ role_title }} position at {{ company }}"

  gentle:
    name: "Gentle Sequence"
    schedule_initial_at: "10:00"  # Schedule for 10 AM CST next day (later for gentle)
    steps:
      - step: 0
        template: "initial"
        wait_days: 5
        subject: "Application for {{ role_title }} position at {{ company }}"
      - step: 1
        template: "followup_1"
        wait_days: 7
        subject: "Following up on my application for {{ role_title }} at {{ company }}"
      - step: 2
        template: "followup_2"
        wait_days: 10
        subject: "Final follow-up: {{ role_title }} position at {{ company }}"
