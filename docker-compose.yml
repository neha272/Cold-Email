services:
  cold-emailer:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/neha272/cold-email:latest  # Uncomment after first push to GHCR
    container_name: cold-emailer
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Flask
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me-in-production}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PORT=${PORT:-5000}
      
      # SMTP Configuration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      
      # IMAP Configuration
      - IMAP_HOST=${IMAP_HOST}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - IMAP_USE_SSL=${IMAP_USE_SSL:-true}
      
      # Throttling
      - DAILY_MAX_EMAILS=${DAILY_MAX_EMAILS:-50}
      - PER_MINUTE_LIMIT=${PER_MINUTE_LIMIT:-5}
      
      # Safety
      - REQUIRE_CONFIRM_SEND=${REQUIRE_CONFIRM_SEND:-false}
      - SAFE_MODE=${SAFE_MODE:-true}
    volumes:
      # Persist data across container restarts
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    user: "1000:1000"
