[mypy]
# Ignore missing stubs for third-party libraries
ignore_missing_imports = False

[mypy-flask_httpauth.*]
ignore_missing_imports = True

[mypy-backports.zoneinfo.*]
ignore_missing_imports = True

[mypy-flask_limiter.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-openpyxl.styles.*]
ignore_missing_imports = True

# Web app has many Flask routes that are hard to fully type
[mypy-cold_emailer.web.app]
disable_error_code = no-untyped-def, var-annotated

# IMAP library returns complex types
[mypy-cold_emailer.mailer.imap_reply_detector]
disable_error_code = assignment, index, arg-type, return-value
