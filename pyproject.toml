[tool.poetry]
name = "cold-emailer"
version = "0.1.0"
description = "Local cold-email automation tool with state tracking, dynamic PDF attachments, and follow-up sequencing"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "cold_emailer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = "^0.12.0"}
sqlalchemy = "^2.0.0"
jinja2 = "^3.1.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"
structlog = "^24.1.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
openpyxl = "^3.1.0"  # for Excel support
email-validator = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^24.1.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
types-pyyaml = "^6.0.18"
types-python-dotenv = "^1.0.0"

[tool.poetry.scripts]
cold-emailer = "cold_emailer.cli:app"

[tool.poetry.group.dev.scripts]
format = "black src tests"
lint = "ruff check src tests"
type-check = "mypy src"
test = "pytest"
test-cov = "pytest --cov=cold_emailer --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=cold_emailer --cov-report=term-missing"
